name: Build and Upload Static Site

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build

      - name: Export static files
        run: npm run export

      - name: Check 'out' directory contents
        run: |
          if [ ! -d "out" ]; then
            echo "Error: 'out' directory is missing."
            exit 1
          elif [ -z "$(ls -A out)" ]; then
            echo "Error: 'out' directory is empty."
            echo "Current directory contents:"
            ls -la
            exit 1
          else
            echo "'out' directory exists and has files:"
            ls -la out
          fi

      - name: Upload static site artifact
        uses: actions/upload-artifact@v3
        with:
          name: static-site
          path: out
