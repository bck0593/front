name: Build Static Site

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm install

      - run: npm run build

      - run: ls -la out

      - run: |
          if [ ! -d "out" ] || [ -z "$(ls -A out)" ]; then
            echo "Error: 'out' directory is missing or empty."
            exit 1
          fi

      - uses: actions/upload-artifact@v3
        with:
          name: static-site
          path: out
