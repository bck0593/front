name: Build and Deploy Static Site

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ソースコードをチェックアウト
      - uses: actions/checkout@v3

      # Node.js 18 をセットアップ
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 依存関係インストール
      - run: npm install

      # Next.js のビルド
      - run: npm run build

      # (next exportはNext.jsのバージョンによっては不要、または設定でexportする)
      # もし使うなら有効化、最新のNext.jsではnext.config.jsで設定が必要
      # - run: npm run export

      # 'out'ディレクトリの内容を確認
      - run: ls -la out

      # 'out'フォルダの存在と中身のチェック
      - run: |
          if [ ! -d "out" ] || [ -z "$(ls -A out)" ]; then
            echo "Error: 'out' directory is missing or empty."
            exit 1
          fi

      # ビルド成果物をアップロード（任意。別ジョブで使うなら）
      - uses: actions/upload-artifact@v3
        with:
          name: static-site
          path: out

      # Azure Static Web Appsへデプロイ（例）
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"          # Next.jsのプロジェクトルートに合わせて変更
          output_location: "out"    # next exportの出力先に合わせる
