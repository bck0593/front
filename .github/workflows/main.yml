name: Build and Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm install

      - run: npm run build

      - run: npm run export

      # GitHub Marketplace APIへの通信確認
      - name: Test GitHub Marketplace API access
        run: |
          echo "Testing access to GitHub Marketplace API..."
          curl -v https://api.github.com/repos/actions/upload-artifact || echo "Failed to access GitHub API"
          curl -v https://api.github.com/repos/actions/upload-artifact/releases/latest || echo "Failed to access GitHub API"

      - uses: actions/upload-artifact@v2
        with:
          name: static-site
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v2
        with:
          name: static-site
          path: out

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "."
          output_location: "out"
