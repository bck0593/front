name: Build and Deploy Next.js App to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # .env.localを生成（環境変数を渡す）
      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.FASTAPI_URL }}" > .env.local

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # .next, node_modules, package.json, next.config.js, public など本番に必要なものをzipでまとめる
      - name: Archive production build
        run: |
          zip -r build.zip .next node_modules public package.json next.config.js .env.local

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-001-step3-1-suzuyu-node-29
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: build.zip
