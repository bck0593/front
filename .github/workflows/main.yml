name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - main  # ← デプロイ対象のブランチ名。変更してもOK

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # 必要に応じて変更

      - name: Install dependencies
        run: npm install
        working-directory: app-001-step3-1-suzuyu-node-29

      - name: Build and export static site
        run: |
          npm run build
          npm run export
        working-directory: app-001-step3-1-suzuyu-node-29

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "app-001-step3-1-suzuyu-node-29"  # package.json がある場所
          output_location: "app-001-step3-1-suzuyu-node-29/out"  # 静的HTMLが出力される場所
