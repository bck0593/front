name: Build and Upload Static Site

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Export static site
        run: npm run export

      - name: Show contents of out directory
        run: |
          echo "=== out directory contents ==="
          ls -la out || echo "'out' directory does not exist"

      - name: Check if 'out' directory exists and is not empty
        run: |
          if [ ! -d "out" ] || [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "Error: 'out' directory is missing or empty."
            exit 1
          fi

      - name: Upload static site as artifact
        uses: actions/upload-artifact@v3.1.2  # ← ここがポイント
        with:
          name: static-site
          path: out
