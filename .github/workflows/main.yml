jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm install

      - run: npm run build

      - run: npm run export

      # ここで out フォルダの中身を確認
      - run: ls -la out

      - uses: actions/upload-artifact@v3
        with:
          name: static-site
          path: out
