name: Build and Deploy Next.js App to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create .env.local
        run: |
          echo "NEXT_PUBLIC_API_ENDPOINT=${{ secrets.FASTAPI_URL }}" > .env.local

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Archive app for deployment
        run: |
          zip -r build.zip .next .env.local package.json package-lock.json next.config.js public src

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-001-step3-1-suzuyu-node-29
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: build.zip
