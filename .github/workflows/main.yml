name: Build and Upload Static Site

on:
  push:
    branches:
      - main

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - run: npm install

      - run: npm run build

      # outディレクトリの中身を確認（デバッグ用）
      - run: ls -la out || echo "'out' directory does not exist"

      # outディレクトリの存在と中身のチェック
      - run: |
          if [ ! -d "out" ] || [ -z "$(ls -A out 2>/dev/null)" ]; then
            echo "Error: 'out' directory is missing or empty."
            exit 1
          fi

      # outディレクトリをartifactとしてアップロード
      - uses: actions/upload-artifact@v3
        with:
          name: static-site
          path: out
